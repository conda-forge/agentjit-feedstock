context:
  version: "0.1.10"

package:
  name: agentjit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agentjit/agentjit-${{ version }}.tar.gz
  sha256: 2a13efc6c1e228d801a6728c61befa87aa7e922d40fad2b5952ff1114c213607

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - agentjit
      pip_check: true

about:
  homepage: https://github.com/eminsk/agentjit
  summary: Just-In-Time Compiler for AI Agent Trajectories
  description: |
    AgentJIT traces dynamic agent trajectories and compiles them into pure,
    type-safe, ultra-fast Python code with zero token cost.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/eminsk/agentjit
  documentation: https://github.com/eminsk/agentjit#readme

extra:
  recipe-maintainers:
    - eminsk
